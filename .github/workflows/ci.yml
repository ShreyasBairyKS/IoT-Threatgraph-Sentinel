name: CI

on:
  push:
    branches: [main, dev2]
  pull_request:
    branches: [main, dev2]

jobs:
  backend:
    name: Backend / ML / Graph tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r ml/requirements.txt
          pip install -r graph/requirements.txt
          pip install ruff

      - name: Lint (ruff)
        # Informational only for now: the existing test suite has a backlog
        # of pre-existing lint findings (unused imports, naming) unrelated
        # to any single change, so this isn't a merge gate yet.
        run: ruff check .
        continue-on-error: true

      - name: Run tests
        run: pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check + build
        run: npm run build
