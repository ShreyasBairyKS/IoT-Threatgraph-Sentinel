[project]
name = "iot-threatgraph-sentinel"
version = "0.1.0"
description = "IoT ThreatGraph Sentinel – real-time IoT threat detection and intelligence platform"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
