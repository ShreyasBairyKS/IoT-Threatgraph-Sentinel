[project]
name = "iot-threatgraph-sentinel"
version = "0.1.0"
description = "IoT ThreatGraph Sentinel – real-time IoT threat detection and intelligence platform"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["ml/tests", "tests", "graph/tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "N803", "N806"]  # N803/N806: uppercase matrix names are ML convention

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
